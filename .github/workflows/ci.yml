name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Verify backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import compileall
          import pathlib
          import sys

          ok = True
          for path in pathlib.Path(".").glob("*.py"):
              ok = compileall.compile_file(str(path), quiet=1) and ok

          sys.exit(0 if ok else 1)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Railway Docker image
        run: docker build -t fusionlab:ci .
